[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-to-howto"
version = "0.1.0"
description = "Privacy-preserving local chat export and how-to generation"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "httpx==0.28.1", "pydantic==2.13.5", "python-docx==1.2.0", "uvicorn==0.52.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
